<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Customs — App Check</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        background: #f5f5f7;
        color: #1d1d1f;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 17px;
        line-height: 1.5;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 3rem 1.5rem 5rem;
      }
      h1 {
        font-size: 2.5rem;
        letter-spacing: -0.03em;
        margin: 0 0 0.5rem;
      }
      .intro {
        color: #6e6e73;
        margin: 0 0 2.5rem;
      }
      section {
        background: #fff;
        border-radius: 18px;
        padding: 2rem;
        margin-bottom: 2rem;
      }
      h2 {
        font-size: 1.4rem;
        letter-spacing: -0.02em;
        margin: 0 0 1.25rem;
      }
      figure {
        margin: 0;
      }
      img {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
        border: 1px solid #d2d2d7;
        border-radius: 12px;
      }
      img.narrow {
        max-width: 420px;
      }
      figcaption {
        margin-top: 1rem;
      }
      .result {
        display: inline-block;
        font-size: 0.8rem;
        font-weight: 600;
        color: #00356b;
        border: 1px solid #00356b;
        border-radius: 999px;
        padding: 0.05rem 0.6rem;
        margin-right: 0.4rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Campus Customs — App Check</h1>
      <p class="intro">Manual checks on the running site (React front end + FastAPI / PydanticAI agent), with screenshots.</p>

      <section>
        <h2>1. Chat checking the inventory level</h2>
        <figure>
          <img src="app_check_images/1-chat-inventory-check.webp" alt="Benjamin Franklin Fleece Jacket product page with the chat answering an availability question" />
          <figcaption>
            <span class="result">PASS</span>
            Asked about the Benjamin Franklin Fleece Jacket, the agent answered from the live inventory: S, M, L and XL in stock, 31 total, XS and XXL sold out. That matches the database and the size pills on the page, where the sold-out sizes are greyed and struck through.
          </figcaption>
        </figure>
      </section>

      <section>
        <h2>2. Dynamic search results cards appearing</h2>
        <figure>
          <img class="narrow" src="app_check_images/2-chat-search-cards.png" alt="Chat reply to 'what kinds of hoodies do you have?' with product cards and a See all 27 link" />
          <figcaption>
            <span class="result">PASS</span>
            "What kinds of hoodies do you have?" made the agent search the catalogue and return all 27 matches as live product cards with photo, price and in-stock sizes, plus a "See all 27 on the page" link. The cards are built from the database, not hardcoded.
          </figcaption>
        </figure>
      </section>

      <section>
        <h2>3. Usability feature: search bar on Products</h2>
        <figure>
          <img src="app_check_images/3-products-search-bar.webp" alt="Products page filtered by the search bar to 27 hoodies" />
          <figcaption>
            <span class="result">PASS</span>
            Typing "hoodie" in the Products search bar instantly filtered the catalogue to "27 of 102 items" and highlighted the Hoodies chip. That's the same 27 the chat agent found, so shoppers no longer need to scroll the whole catalogue.
          </figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
